[pc]

; set path to BIOS and VGA BIOS
bios = bios.bin
vga_bios = vgabios.bin

; set memory size and VGA memory size
mem_size = 32M
vga_mem_size = 1M

; fda/fdb for floppy disks (optional)
;fda = disk01.img
;fda = Windows95b.img
;fdb = patcher9x-0.9.91-boot.img

; Note: Each letter can only be used once between hd and cd as they are the IDE channels and systems only had 4 IDE channels.
; hda/hdb/hdc/hdd for hard disks (optional)
hda = win95_c_drive.img
hdb = win95_d_drive_all.img
;hda = win95_c_drive.img
;hdb = win95_d_drive_all.img
;hdc = win95_d_drive_cc.img
;hdb = win95_d_drive_a.img
;hdb = win95_d_drive_gtp.img
;hdb = win95_d_drive_ns.img

; cda/cdb/cdc/cdd for CD-ROM disks (optional)
;
; No CD mounted: the game runs from the two hard-disk images alone, and every
; image is loaded whole into browser memory. win95_extra_files.iso is 632 MB --
; more than half the per-client footprint -- so leaving it out takes a client
; from ~1.2 GB to ~590 MB, which is what makes running several at once viable.
; Re-enable only if you need the install media.
;cdc = Win95_OSR25.iso
;cdd = win95_extra_filesj.iso
;cdd = VCP600ENU1.iso
cdd = win95_extra_files.iso
;cdd = softgpu-0.8.2025.53.iso
;cdd = vesa.iso

; "fill_cmos" fixes "MS-DOS compatibility mode" in win9x, but it breaks winNT...
fill_cmos = 1

; force 8-dot mode (640 pixel wide in text mode) if set to 1
vga_force_8dm = 1

[display]
width = 640
height = 480

[cpu]
; gen = 3/4/5/6, for 386/486/586/686
gen = 6
; fpu = 0/1, to disable/enable x87
fpu = 1
