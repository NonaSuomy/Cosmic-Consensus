[Update Script]
Script Version = 1.0
Show ID        = ACR
Show Name      = Acrophobia Netshow


1 Goto         = Set Ad Server Folder
2 Goto         = Update Resources


[Server Version Folders]
1.0.0.29      = /acrophobia/content/ClientVersion1.6.0.151
1.2.0.130     = /acrophobia/content/ClientVersion1.6.0.151
1.0.24.84     = /acrophobia/content/ClientVersion1.6.0.151
1.0.18.79     = /acrophobia/content/ClientVersion1.6.0.151
