;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;; CatAniml.srf
[CatAniml.srf]
1 Goto         = If CatAniml.srf exists
2 Goto         = If CatAniml.srf does not exist

[If CatAniml.srf exists]
Command        = IF CLIENT_PATH NOTEQUALTO VERSION THEN UPDATE
Client Path    = Srf/CatAniml.srf
Version        = 1.0.20.80
Group Priority = 101
Mandatory      = FALSE

[If CatAniml.srf does not exist]
Command        = IF CLIENT_PATH DOESNOTEXIST THEN UPDATE
Client Path    = Srf/CatAniml.srf
Version        = 1.0.20.80
Group Priority = 101
Mandatory      = TRUE
 
