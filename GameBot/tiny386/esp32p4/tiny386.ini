[esp]
; WIFI/Ethernet config
; Network: (ethernet/wifi/off)
network = ethernet
;ssid = YOUR_WIFI_SSID
;pass = YOUR_WIFI_PASSWORD

; USB Host Support (Keyboard/Mouse/etc)
enable_usb = 1

; EK79007 Elecrow ESP32-P4 AIO
; Screen rotation
rotation = 180
; Touch Screen rotation
touch_rotation = 0

; Existing mouse-like behavior, default
touch_mode = relative
; Finger position moves cursor directly
;touch_mode = absolute

[pc]
; set path to BIOS and VGA BIOS
bios = /sdcard/bios.bin
vga_bios = /sdcard/vgabios.bin

; set memory size and VGA memory size
mem_size = 27M
vga_mem_size = 3M

; fda/fdb for floppy disks (optional)
;fda = disk01.img

; Note: Each letter can only be used once between hd and cd as they are the IDE channels and systems only had 4 IDE channels.

; hda/hdb/hdc/hdd for hard disks (optional)
hda = /sdcard/win95_c_drive.img
hdb = /sdcard/win95_d_drive_all.img
hdc = /sdcard/micro95.img

; cda/cdb/cdc/cdd for CD-ROM disks (optional)
cdd = /sdcard/win95_extra_drivers.iso
;cdd = /sdcard/win95_files_extra.iso
;cdd = /sdcard/Win95_OSR25.iso
;
; "fill_cmos" fixes "MS-DOS compatibility mode" in win9x, but it breaks WinNT.
fill_cmos = 1

; force 8-dot mode (640 pixel wide in text mode) if set to 1
vga_force_8dm = 1

[display]
width = 640
height = 480

[cpu]
; gen = 3/4/5/6, for 386/486/586/686
gen = 6
; fpu = 0/1, to disable/enable x87
fpu = 1
